name: Google release apk
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  Demo-github-action:
    runs-on: ubuntu-latest
    steps:
      - name: Start info
        run: echo "Release job run on tag ${{ github.ref_name }}"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      - name: Build release Google APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: Save artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: composeApp/build/outputs/apk/release/
      - name: Cleanup keystore
        if: always()
        run: rm -f keystore.jks
