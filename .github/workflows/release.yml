name: Google release apk
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  Demo-github-action:
    runs-on: ubuntu-latest
    steps:
      - name: Start info
        run: echo "Release job run on tag ${{ github.ref_name }}"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Save artifact
        uses: actions/upload-artifact@v6
        with:
          name: debug-apk
          path: composeApp/build/outputs/apk/debug/
