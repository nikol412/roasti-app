name: Google release apk
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  Demo-github-action:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Start info
        run: echo "Release job run on tag ${{ github.ref_name }}"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE_64 }}
      - name: Build release Google APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/keystore.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      - name: Save artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: composeApp/build/outputs/apk/release/
      - name: Create Github release
        run: |
          gh release create ${{ github.ref_name }} \
            composeApp/build/outputs/apk/release/*.apk \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify Telegram
        run: |
          NOTES=$(gh release view ${{ github.ref_name }} --json body -q '.body' || echo "")
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          TEXT="✅ Release ${{ github.ref_name }}"$'\n'"$RELEASE_URL"
          if [ -n "$NOTES" ]; then
            TEXT="$TEXT"$'\n\n'"$NOTES"
          fi
          RESPONSE=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d message_thread_id="$THREAD_ID" \
            --data-urlencode text="$TEXT")
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q '"ok":false'; then
            exit 1
          fi
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cleanup keystore
        if: always()
        run: rm -f keystore.jks
