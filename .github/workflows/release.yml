name: Google release apk
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  Demo-github-action:
    runs-on: ubuntu-latest
    steps:
      - name: Start info
        run: echo "Release job run on tag ${{ github.ref_name }}"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
